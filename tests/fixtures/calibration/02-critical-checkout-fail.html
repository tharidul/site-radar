<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Complete Your Purchase (Critical Insecurity Simulation)</title>
  <meta name="description" content="Simulated e-commerce checkout flow containing critical true defects including unencrypted HTTP submission, exposed credentials, and unlabeled interactive controls.">
  <link rel="canonical" href="https://example.com/checkout">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      margin-top: 0.25rem;
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: #dc2626;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Secure E-Commerce Checkout</h1>
    <p>Please enter your payment details below to complete your order.</p>

    <!-- CRITICAL TRUE DEFECT 1: Form submitting credentials to insecure HTTP endpoint -->
    <form id="checkout-form" action="http://insecure-payment.example.com/checkout/process" method="POST">
      <div class="form-group">
        <span>Payment Card Number</span>
        <!-- A11Y TRUE DEFECT: Form field missing accessible label (no label-for or aria-label) -->
        <input type="text" name="card_number" id="card_number_input" placeholder="XXXX-XXXX-XXXX-XXXX" />
      </div>

      <div class="form-group">
        <span>Expiration Date</span>
        <!-- A11Y TRUE DEFECT: Unlabeled input -->
        <input type="text" name="exp_date" id="exp_date_input" placeholder="MM/YY" />
      </div>

      <div class="form-group">
        <!-- CRITICAL TRUE DEFECT 2: Password/PIN field submitted over insecure HTTP action -->
        <span>Card Security PIN / Password</span>
        <input type="password" name="card_pin" id="card_pin" placeholder="Enter PIN" />
      </div>

      <!-- CRITICAL TRUE DEFECT 3: Unlabeled submit button in critical purchase flow (axe-core button-name failure) -->
      <button type="submit" class="btn-submit" id="btn-pay"></button>
    </form>
  </main>
</body>
</html>
